AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ''
Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
  Api:
    EndpointConfiguration: REGIONAL

Resources:
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId: vpc-07490d29cedde3872

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Postgres RDS
      VpcId: vpc-07490d29cedde3872
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  MyDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Postgres
      SubnetIds:
        - subnet-024b20c484292353b
        - subnet-09aa82884bd18c7bb
        - subnet-0470a748e5174906c

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username":"db_user"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'

  MyPostgresDB:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      DBName: my_database
      MasterUsername: db_user
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref MyDBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup

  # DynamoDB
  ChannelsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: Channels
      PrimaryKey:
        Name: Id
        Type: String

  # ── SQS Queue ────────────────────────────────────────────────────────
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: notifications
  # ── Lambda Functions ────────────────────────────────────────────────

  #USER LAMBDA

  # GetOneUsers:
  #   Type: AWS::Serverless::Function
  #   Properties:
  #     FunctionName: GetOneUsers
  #     CodeUri: src/Users/
  #     Handler: GetOneUsers.lambda_handler
  #     Policies:
  #       - AWSLambdaBasicExecutionRole
  #     Environment:
  #       Variables:
  #         DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
  #         DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
  #         DB_NAME: my_database
  #         DB_USER: db_user
  #         DB_PASSWORD: my_secure_password
  #     Events:
  #       GetOneUsers:
  #         Type: Api
  #         Properties:
  #           Path: /api/users/{user_id}
  #           Method: GET
  GetAllUsers:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetAllUsers
      CodeUri: src/Users/
      Handler: GetAllUsers.lambda_handler
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - subnet-024b20c484292353b
          - subnet-09aa82884bd18c7bb
          - subnet-0470a748e5174906c
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
          DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      Events:
        GetAllUsers:
          Type: Api
          Properties:
            Path: /api/users
            Method: GET
  SignUpUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SignUpUser
      CodeUri: src/
      Handler: Users.SignUpUser.lambda_handler
      Timeout: 20
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - subnet-024b20c484292353b
          - subnet-09aa82884bd18c7bb
          - subnet-0470a748e5174906c
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
          DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      Events:
        SignUpUser:
          Type: Api
          Properties:
            Path: /api/users/create
            Method: POST
  UpdateUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UpdateUser
      CodeUri: src/Users/
      Handler: UpdateUser.lambda_handler
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - subnet-024b20c484292353b
          - subnet-09aa82884bd18c7bb
          - subnet-0470a748e5174906c
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
          DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      Events:
        UpdateUser:
          Type: Api
          Properties:
            Path: /api/users
            Method: PUT
  DeleteUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DeleteUser
      CodeUri: src/Users/
      Handler: DeleteUser.lambda_handler
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - subnet-024b20c484292353b
          - subnet-09aa82884bd18c7bb
          - subnet-0470a748e5174906c
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
          DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      Events:
        DeleteUser:
          Type: Api
          Properties:
            Path: /api/users/{user_id}
            Method: DELETE
  Login:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Login
      CodeUri: src/
      Handler: Users.Login.lambda_handler
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - subnet-024b20c484292353b
          - subnet-09aa82884bd18c7bb
          - subnet-0470a748e5174906c
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
          DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      Events:
        Login:
          Type: Api
          Properties:
            Path: /api/users
            Method: POST
  #MESSAGE LAMBDA

  CreateChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CreateChannel
      CodeUri: src/Messages/
      Handler: CreateChannel.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel
            Method: POST
  GetAllChannels:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetAllChannels
      CodeUri: src/Messages/
      Handler: GetAllChannels.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel
            Method: GET
  GetChannelById:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetChannelById
      CodeUri: src/Messages/
      Handler: GetChannelById.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/{channel_id}
            Method: GET
  GetChannelsByUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetChannelsByUser
      CodeUri: src/Messages/
      Handler: GetChannelsByUser.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/user/{userId}
            Method: GET
  UpdateChannelName:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UpdateChannelName
      CodeUri: src/Messages/
      Handler: UpdateChannelName.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/{channel_id}
            Method: PUT
  RemoveUserFromChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RemoveUserFromChannel
      CodeUri: src/Messages/
      Handler: RemoveUserFromChannel.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/user/remove/{user_id}
            Method: PUT
  AddUserToChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AddUserToChannel
      CodeUri: src/Messages/
      Handler: AddUserToChannel.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/user/add/{user_id}
            Method: PUT
  DeleteChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DeleteChannel
      CodeUri: src/Messages/
      Handler: DeleteChannel.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/{channel_id}
            Method: DELETE
