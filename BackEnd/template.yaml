AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
  Api:
    EndpointConfiguration: REGIONAL
Resources:
  NeptuneSubnetGroup:
    Type: AWS::Neptune::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Neptune subnet group
      SubnetIds:
        - subnet-12345678
        - subnet-87654321
  NeptuneCluster:
    Type: AWS::Neptune::DBCluster
    Properties:
      DBSubnetGroupName: !Ref NeptuneSubnetGroup
      VpcSecurityGroupIds:
        - sg-12345678
  NeptuneInstance:
    Type: AWS::Neptune::DBInstance
    Properties:
      DBClusterIdentifier: !Ref NeptuneCluster
      DBInstanceClass: db.r6g.large
  # ── SQS Queue ────────────────────────────────────────────────────────
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: notifications
  # ── Lambda Functions ────────────────────────────────────────────────
  SendMessage:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SendMessage
      CodeUri: src/Messages/SendMessage/
      Handler: app.lambda_handler
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationQueue.QueueName
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Environment:
        Variables:
          QUEUE_URL: !Ref NotificationQueue
      Events:
        SendMessage:
          Type: Api
          Properties:
            Path: /api/messages
            Method: POST
    GetMessages:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetMessages
      CodeUri: src/Messages/GetMessages/
      Handler: app.lambda_handler
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationQueue.QueueName
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Environment:
        Variables:
          QUEUE_URL: !Ref NotificationQueue
      Events:
        GetMessages:
          Type: Api
          Properties:
            Path: /api/messages
            Method: GET
    UpdateMessages:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UpdateMessages
      CodeUri: src/Messages/UpdateMessages/
      Handler: app.lambda_handler
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationQueue.QueueName
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Environment:
        Variables:
          QUEUE_URL: !Ref NotificationQueue
      Events:
        UpdateMessages:
          Type: Api
          Properties:
            Path: /api/messages
            Method: UPDATE
    DeleteMessages:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DeleteMessages
      CodeUri: src/Messages/DeleteMessages/
      Handler: app.lambda_handler
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationQueue.QueueName
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Environment:
        Variables:
          QUEUE_URL: !Ref NotificationQueue
      Events:
        DeleteMessages:
          Type: Api
          Properties:
            Path: /api/messages
            Method: DELETE

  NotifyDirectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: mod05-notify-director-consumer
      CodeUri: ex5-2/notify_director/
      Handler: app.lambda_handler
      Events:
        NotificationQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationQueue.Arn
            BatchSize: 10

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  NotificationQueueUrl:
    Value: !Ref NotificationQueue
  NotificationQueueArn:
    Value: !GetAtt NotificationQueue.Arn
  ProducerFunctionName:
    Value: !Ref SignUpForAuditionFunction
  ConsumerFunctionName:
    Value: !Ref NotifyDirectorFunction