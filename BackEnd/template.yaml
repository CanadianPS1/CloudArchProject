AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ''
Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
  Api:
    EndpointConfiguration: REGIONAL

Resources:
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId: vpc-0097d5ecedf0fc0c5

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Postgres RDS
      VpcId: vpc-0097d5ecedf0fc0c5
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  MyDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Postgres
      SubnetIds:
        - subnet-013ab40ccdb082226
        - subnet-0ff2a9217a5a24230
        - subnet-000bbe0ea15d9fbcb

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username":"db_user"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'

  MyPostgresDB:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      DBName: my_database
      MasterUsername: db_user
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref MyDBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup

  # DynamoDB
  ChannelsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: Channels
      PrimaryKey:
        Name: Id
        Type: String

  # ── SQS Queue ────────────────────────────────────────────────────────
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: notifications
  # ── Lambda Functions ────────────────────────────────────────────────

  #USER LAMBDA

  # GetOneUsers:
  #   Type: AWS::Serverless::Function
  #   Properties:
  #     FunctionName: GetOneUsers
  #     CodeUri: src/Users/
  #     Handler: GetOneUsers.lambda_handler
  #     Policies:
  #       - AWSLambdaBasicExecutionRole
  #     Environment:
  #       Variables:
  #         DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
  #         DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
  #         DB_NAME: my_database
  #         DB_USER: db_user
  #         DB_PASSWORD: my_secure_password
  #     Events:
  #       GetOneUsers:
  #         Type: Api
  #         Properties:
  #           Path: /api/users/{user_id}
  #           Method: GET
  GetAllUsers:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetAllUsers
      CodeUri: src/Users/
      Handler: GetAllUsers.lambda_handler
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - subnet-013ab40ccdb082226
          - subnet-0ff2a9217a5a24230
          - subnet-000bbe0ea15d9fbcb
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSSendMessagePolicy:
            QueueName: notifications
      Environment:
        Variables:
          DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
          DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
      Events:
        GetAllUsers:
          Type: Api
          Properties:
            Path: /api/users
            Method: GET
  SignUpUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SignUpUser
      CodeUri: src/
      Handler: Users.SignUpUser.lambda_handler
      Timeout: 20
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - subnet-013ab40ccdb082226
          - subnet-0ff2a9217a5a24230
          - subnet-000bbe0ea15d9fbcb
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSSendMessagePolicy:
            QueueName: notifications
      Environment:
        Variables:
          DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
          DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
      Events:
        SignUpUser:
          Type: Api
          Properties:
            Path: /api/users/create
            Method: POST
  UpdateUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UpdateUser
      CodeUri: src/Users/
      Handler: UpdateUser.lambda_handler
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - subnet-013ab40ccdb082226
          - subnet-0ff2a9217a5a24230
          - subnet-000bbe0ea15d9fbcb
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSSendMessagePolicy:
            QueueName: notifications
      Environment:
        Variables:
          DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
          DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
      Events:
        UpdateUser:
          Type: Api
          Properties:
            Path: /api/users
            Method: PUT
  DeleteUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DeleteUser
      CodeUri: src/Users/
      Handler: DeleteUser.lambda_handler
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - subnet-013ab40ccdb082226
          - subnet-0ff2a9217a5a24230
          - subnet-000bbe0ea15d9fbcb
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSSendMessagePolicy:
            QueueName: notifications
      Environment:
        Variables:
          DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
          DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
      Events:
        DeleteUser:
          Type: Api
          Properties:
            Path: /api/users/{user_id}
            Method: DELETE
  Login:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Login
      CodeUri: src/
      Handler: Users.Login.lambda_handler
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - subnet-013ab40ccdb082226
          - subnet-0ff2a9217a5a24230
          - subnet-000bbe0ea15d9fbcb
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSSendMessagePolicy:
            QueueName: notifications
      Environment:
        Variables:
          DB_HOST: !GetAtt MyPostgresDB.Endpoint.Address
          DB_PORT: !GetAtt MyPostgresDB.Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
      Events:
        Login:
          Type: Api
          Properties:
            Path: /api/users
            Method: POST
  #MESSAGE LAMBDA

  CreateChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CreateChannel
      CodeUri: src/Channels/
      Handler: CreateChannel.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
        - SQSSendMessagePolicy:
            QueueName: notifications
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel
            Method: POST
      Environment:
        Variables:
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
  GetAllChannels:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetAllChannels
      CodeUri: src/Channels/
      Handler: GetAllChannels.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
        - SQSSendMessagePolicy:
            QueueName: notifications
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel
            Method: GET
      Environment:
        Variables:
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
  GetChannelById:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetChannelById
      CodeUri: src/Channels/
      Handler: GetChannelById.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
        - SQSSendMessagePolicy:
            QueueName: notifications
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/{channel_id}
            Method: GET
      Environment:
        Variables:
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
  GetChannelsByUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetChannelsByUser
      CodeUri: src/Channels/
      Handler: GetChannelsByUser.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
        - SQSSendMessagePolicy:
            QueueName: notifications
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/user/{userId}
            Method: GET
      Environment:
        Variables:
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
  UpdateChannelName:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UpdateChannelName
      CodeUri: src/Channels/
      Handler: UpdateChannelName.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
        - SQSSendMessagePolicy:
            QueueName: notifications
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/{channel_id}
            Method: PUT
      Environment:
        Variables:
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
  RemoveUserFromChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RemoveUserFromChannel
      CodeUri: src/Channels/
      Handler: RemoveUserFromChannel.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
        - SQSSendMessagePolicy:
            QueueName: notifications
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/user/remove/{user_id}
            Method: PUT
      Environment:
        Variables:
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
  AddUserToChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AddUserToChannel
      CodeUri: src/Channels/
      Handler: AddUserToChannel.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
        - SQSSendMessagePolicy:
            QueueName: notifications
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/user/add/{user_id}
            Method: PUT
      Environment:
        Variables:
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
  DeleteChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DeleteChannel
      CodeUri: src/Channels/
      Handler: DeleteChannel.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Channels
        - SQSSendMessagePolicy:
            QueueName: notifications
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/{channel_id}
            Method: DELETE
      Environment:
        Variables:
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
  SendMessage:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SendMessage
      CodeUri: src/Messages/
      Handler: CreateMessages.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy: #read access
            TableName: !Ref ChannelsTable
        - DynamoDBCrudPolicy: #full access
            TableName: !Ref MessagesTable
      Environment:
        Variables:
          QUEUE_URL: !Ref NotificationQueue
          CHANNEL_TABLE_NAME: !Ref ChannelsTable
          MESSAGE_TABLE_NAME: !Ref MessagesTable
      Events:
        SendMessage:
          Type: Api
          Properties:
            Path: /api/messages/post
            Method: POST
 
  GetMessages:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetMessages
      CodeUri: src/Messages/
      Handler: GetMessagesByBatch.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy: #read access
            TableName: !Ref ChannelsTable
        - DynamoDBCrudPolicy: #full access
            TableName: !Ref MessagesTable
      Environment:
        Variables:
          QUEUE_URL: !Ref NotificationQueue
          CHANNEL_TABLE_NAME: !Ref ChannelsTable
          MESSAGE_TABLE_NAME: !Ref MessagesTable
      Events:
        SendMessage:
          Type: Api
          Properties:
            Path: /api/messages/get/{channel_id}/{message_batch_number}
            Method: GET
 
  UpdateMessages:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UpdateMessages
      CodeUri: src/Messages/
      Handler: UpdateMessages.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy: #full access
            TableName: !Ref MessagesTable
      Environment:
        Variables:
          QUEUE_URL: !Ref NotificationQueue
          MESSAGE_TABLE_NAME: !Ref MessagesTable
      Events:
        SendMessage:
          Type: Api
          Properties:
            Path: /api/messages/put
            Method: PUT
           
  DeleteMessages:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DeleteMessages
      CodeUri: src/Messages/
      Handler: DeleteMessages.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy: #full access
            TableName: !Ref MessagesTable
      Environment:
        Variables:
          QUEUE_URL: !Ref NotificationQueue
          MESSAGE_TABLE_NAME: !Ref MessagesTable
      Events:
        SendMessage:
          Type: Api
          Properties:
            Path: /api/messages/delete/{channel_id}/{sort_key}
            Method: DELETE
Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  DatabaseEndpoint:
    Description: PostgreSQL database endpoint
    Value: !GetAtt MyPostgresDB.Endpoint.Address
  DatabasePort:
    Description: PostgreSQL database port
    Value: !GetAtt MyPostgresDB.Endpoint.Port
  DatabaseName:
    Description: PostgreSQL database name
    Value: my_database
  NotificationQueueUrl:
    Description: SQS notification queue URL
    Value: !Ref NotificationQueue
  NotificationQueueArn:
    Description: SQS notification queue ARN
    Value: !GetAtt NotificationQueue.Arn