AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ''
Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
  Api:
    EndpointConfiguration: REGIONAL
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - staging
    - prod
    Description: Environment stage for naming resources
Resources:
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId:
        Ref: MyVPC
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Postgres RDS
      VpcId:
        Ref: MyVPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        SourceSecurityGroupId:
          Ref: LambdaSecurityGroup
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: MyVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${Stage}-rds-subnet-a
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: MyVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${Stage}-rds-subnet-b
  MyDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Postgres
      SubnetIds:
      - Ref: SubnetA
      - Ref: SubnetB
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username":"db_user"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'
  MyPostgresDB:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      DBName: my_database
      MasterUsername: db_user
      MasterUserPassword:
        Fn::Sub: '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName:
        Ref: MyDBSubnetGroup
      VPCSecurityGroups:
      - Ref: DBSecurityGroup
  ChannelsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: Channels
      PrimaryKey:
        Name: Id
        Type: String
  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: ChannelID
        AttributeType: S
      - AttributeName: SortKey
        AttributeType: S
      KeySchema:
      - AttributeName: ChannelID
        KeyType: HASH
      - AttributeName: SortKey
        KeyType: RANGE
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: notifications
  GetAllUsers:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetAllUsers
      CodeUri: GetAllUsers
      Handler: GetAllUsers.lambda_handler
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroup
        SubnetIds:
        - Ref: SubnetA
        - Ref: SubnetB
      Policies:
      - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          DB_HOST:
            Fn::GetAtt:
            - MyPostgresDB
            - Endpoint.Address
          DB_PORT:
            Fn::GetAtt:
            - MyPostgresDB
            - Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD:
            Fn::Sub: '{{resolve:secretsmanager:${DatabaseSecret}::password}}'
      Events:
        GetAllUsers:
          Type: Api
          Properties:
            Path: /api/users
            Method: GET
    Metadata:
      SamResourceId: GetAllUsers
  SignUpUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SignUpUser
      CodeUri: SignUpUser
      Handler: Users.SignUpUser.lambda_handler
      Timeout: 30
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroup
        SubnetIds:
        - Ref: SubnetA
        - Ref: SubnetB
      Policies:
      - AWSLambdaBasicExecutionRole
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn:
            Ref: DatabaseSecret
      Environment:
        Variables:
          DB_HOST:
            Fn::GetAtt:
            - MyPostgresDB
            - Endpoint.Address
          DB_PORT: 5432
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD:
            Fn::Sub: '{{resolve:secretsmanager:${DatabaseSecret}::password}}'
      Events:
        SignUpUser:
          Type: Api
          Properties:
            Path: /api/users/create
            Method: POST
    Metadata:
      SamResourceId: SignUpUser
  UpdateUsers:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UpdateUsers
      CodeUri: UpdateUsers
      Handler: UpdateUser.lambda_handler
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroup
        SubnetIds:
        - Ref: SubnetA
        - Ref: SubnetB
      Policies:
      - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          DB_HOST:
            Fn::GetAtt:
            - MyPostgresDB
            - Endpoint.Address
          DB_PORT:
            Fn::GetAtt:
            - MyPostgresDB
            - Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD:
            Fn::Sub: '{{resolve:secretsmanager:${DatabaseSecret}::password}}'
      Events:
        UpdateUsers:
          Type: Api
          Properties:
            Path: /api/users/{user_id}
            Method: PUT
    Metadata:
      SamResourceId: UpdateUsers
  DeleteUsers:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DeleteUsers
      CodeUri: DeleteUsers
      Handler: DeleteUser.lambda_handler
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroup
        SubnetIds:
        - Ref: SubnetA
        - Ref: SubnetB
      Policies:
      - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          DB_HOST:
            Fn::GetAtt:
            - MyPostgresDB
            - Endpoint.Address
          DB_PORT:
            Fn::GetAtt:
            - MyPostgresDB
            - Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD:
            Fn::Sub: '{{resolve:secretsmanager:${DatabaseSecret}::password}}'
      Events:
        DeleteUsers:
          Type: Api
          Properties:
            Path: /api/users/{user_id}
            Method: DELETE
    Metadata:
      SamResourceId: DeleteUsers
  Login:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Login
      CodeUri: Login
      Handler: Users.Login.lambda_handler
      VpcConfig:
        SecurityGroupIds:
        - Ref: LambdaSecurityGroup
        SubnetIds:
        - Ref: SubnetA
        - Ref: SubnetB
      Policies:
      - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          DB_HOST:
            Fn::GetAtt:
            - MyPostgresDB
            - Endpoint.Address
          DB_PORT:
            Fn::GetAtt:
            - MyPostgresDB
            - Endpoint.Port
          DB_NAME: my_database
          DB_USER: db_user
          DB_PASSWORD:
            Fn::Sub: '{{resolve:secretsmanager:${DatabaseSecret}::password}}'
      Events:
        Login:
          Type: Api
          Properties:
            Path: /api/users
            Method: POST
    Metadata:
      SamResourceId: Login
  CreateChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CreateChannel
      CodeUri: CreateChannel
      Handler: CreateChannel.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel
            Method: POST
    Metadata:
      SamResourceId: CreateChannel
  GetAllChannels:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetAllChannels
      CodeUri: GetAllChannels
      Handler: GetAllChannels.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel
            Method: GET
    Metadata:
      SamResourceId: GetAllChannels
  GetChannelById:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetChannelById
      CodeUri: GetChannelById
      Handler: GetChannelById.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/{channel_id}
            Method: GET
    Metadata:
      SamResourceId: GetChannelById
  GetChannelsByUser:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetChannelsByUser
      CodeUri: GetChannelsByUser
      Handler: GetChannelsByUser.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/user/{user_id}
            Method: GET
    Metadata:
      SamResourceId: GetChannelsByUser
  UpdateChannelName:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UpdateChannelName
      CodeUri: UpdateChannelName
      Handler: UpdateChannelName.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/{channel_id}
            Method: PUT
    Metadata:
      SamResourceId: UpdateChannelName
  RemoveUserFromChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RemoveUserFromChannel
      CodeUri: RemoveUserFromChannel
      Handler: RemoveUserFromChannel.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/user/remove/{user_id}
            Method: PUT
    Metadata:
      SamResourceId: RemoveUserFromChannel
  AddUserToChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AddUserToChannel
      CodeUri: AddUserToChannel
      Handler: AddUserToChannel.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/user/add/{user_id}
            Method: PUT
    Metadata:
      SamResourceId: AddUserToChannel
  DeleteChannel:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DeleteChannel
      CodeUri: DeleteChannel
      Handler: DeleteChannel.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName: Channels
      Events:
        CreateChannel:
          Type: Api
          Properties:
            Path: /api/channel/{channel_id}
            Method: DELETE
    Metadata:
      SamResourceId: DeleteChannel
  SendMessage:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SendMessage
      CodeUri: SendMessage
      Handler: CreateMessages.lambda_handler
      Policies:
      - AWSLambdaBasicExecutionRole
      - DynamoDBReadPolicy:
          TableName:
            Ref: ChannelsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MessagesTable
      Environment:
        Variables:
          QUEUE_URL:
            Ref: NotificationQueue
          CHANNEL_TABLE_NAME:
            Ref: ChannelsTable
          MESSAGE_TABLE_NAME:
            Ref: MessagesTable
      Events:
        SendMessage:
          Type: Api
          Properties:
            Path: /api/messages/post
            Method: POST
    Metadata:
      SamResourceId: SendMessage
  GetMessages:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetMessages
      CodeUri: GetMessages
      Handler: GetMessagesByBatch.lambda_handler
      Policies:
      - AWSLambdaBasicExecutionRole
      - DynamoDBReadPolicy:
          TableName:
            Ref: ChannelsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MessagesTable
      Environment:
        Variables:
          QUEUE_URL:
            Ref: NotificationQueue
          CHANNEL_TABLE_NAME:
            Ref: ChannelsTable
          MESSAGE_TABLE_NAME:
            Ref: MessagesTable
      Events:
        SendMessage:
          Type: Api
          Properties:
            Path: /api/messages/get/{channel_id}/{message_batch_number}
            Method: GET
    Metadata:
      SamResourceId: GetMessages
  UpdateMessages:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UpdateMessages
      CodeUri: UpdateMessages
      Handler: UpdateMessages.lambda_handler
      Policies:
      - AWSLambdaBasicExecutionRole
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MessagesTable
      Environment:
        Variables:
          QUEUE_URL:
            Ref: NotificationQueue
          MESSAGE_TABLE_NAME:
            Ref: MessagesTable
      Events:
        SendMessage:
          Type: Api
          Properties:
            Path: /api/messages/put
            Method: PUT
    Metadata:
      SamResourceId: UpdateMessages
  DeleteMessages:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DeleteMessages
      CodeUri: DeleteMessages
      Handler: DeleteMessages.lambda_handler
      Policies:
      - AWSLambdaBasicExecutionRole
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MessagesTable
      Environment:
        Variables:
          QUEUE_URL:
            Ref: NotificationQueue
          MESSAGE_TABLE_NAME:
            Ref: MessagesTable
      Events:
        SendMessage:
          Type: Api
          Properties:
            Path: /api/messages/delete/{channel_id}/{sort_key}
            Method: DELETE
    Metadata:
      SamResourceId: DeleteMessages
Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  DatabaseEndpoint:
    Description: PostgreSQL database endpoint
    Value:
      Fn::GetAtt:
      - MyPostgresDB
      - Endpoint.Address
  DatabasePort:
    Description: PostgreSQL database port
    Value:
      Fn::GetAtt:
      - MyPostgresDB
      - Endpoint.Port
  DatabaseName:
    Description: PostgreSQL database name
    Value: my_database
  NotificationQueueUrl:
    Description: SQS notification queue URL
    Value:
      Ref: NotificationQueue
  NotificationQueueArn:
    Description: SQS notification queue ARN
    Value:
      Fn::GetAtt:
      - NotificationQueue
      - Arn
