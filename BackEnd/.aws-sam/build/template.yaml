AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ''
Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
  Api:
    EndpointConfiguration: REGIONAL
Resources:
  MyPostgresDB:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      DBName: my_database
      MasterUsername: db_user
      MasterUserPassword: my_secure_password
  ChannelsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: Id
        Type: String
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: notifications
